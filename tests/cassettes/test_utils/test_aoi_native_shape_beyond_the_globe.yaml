        Group for High Resolution Sea Surface Temperature (GHRSST) Level 4 sea surface
        temperature analysis, produced daily on an operational basis at the Australian
        Bureau of Meteorology (BoM) using optimal interpolation (OI) on a global 0.25
        degree grid. This Global Australian Multi-Sensor SST Analysis (GAMSSA) v1.0
        system blends satellite SST observations from passive infrared and passive
        microwave radiometers with in situ data from ships, drifting buoys and moorings
        from the Global Telecommunications System (GTS). SST observations that have
