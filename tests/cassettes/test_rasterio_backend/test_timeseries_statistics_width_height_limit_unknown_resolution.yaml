        Image\"},{\"Description\":\"The URL for viewing a Worldview visualization.
        The Worldview tool from NASA's Earth Observing System Data and Information
        System (EOSDIS) provides the capability to interactively browse over 600 global,
        full-resolution satellite imagery layers and then download the underlying
        data.\",\"URLContentType\":\"VisualizationURL\",\"Type\":\"GET RELATED VISUALIZATION\",\"Subtype\":\"WORLDVIEW\",\"URL\":\"https://worldview.earthdata.nasa.gov/images/layers/previews/geographic/MODIS_Terra_L3_Land_Surface_Temp_Daily_Day.jpg\"}],\"DataDates\":[{\"Date\":\"2021-02-04T00:00:00.000Z\",\"Type\":\"CREATE\"},{\"Date\":\"2021-02-04T00:00:00.000Z\",\"Type\":\"UPDATE\"}],\"Abstract\":\"The
        Terra Moderate Resolution Imaging Spectroradiometer (MODIS) Land Surface Temperature/Emissivity
        Daily (MOD11A1) Version 6.1 product provides daily per-pixel Land Surface
        Temperature and Emissivity (LST&E) with 1 kilometer (km) spatial resolution
        in a 1,200 by 1,200 km grid. The pixel temperature value is derived from the
        [MOD11_L2](https://doi.org/10.5067/MODIS/MOD11_L2.061) swath product. Above
        30 degrees latitude, some pixels may have multiple observations where the
        criteria for clear-sky are met. When this occurs, the pixel value is a result
        of the average of all qualifying observations. Provided along with the daytime
        and nighttime surface temperature bands are associated quality control assessments,
        observation times, view zenith angles, and clear-sky coverages along with
        bands 31 and 32 emissivities from land cover types.\\n\\nKnown Issues\\n*
