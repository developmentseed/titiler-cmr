        Missions, Instruments, and Measurements (MIM) Database Record (Landsat 9 OLI-2)\",\"URLContentType\":\"PublicationURL\",\"Type\":\"VIEW
        RELATED INFORMATION\",\"Subtype\":\"REQUIREMENTS AND DESIGN\",\"URL\":\"https://database.eohandbook.com/database/instrumentsummary.aspx?instrumentID=1769\"}],\"DataDates\":[{\"Type\":\"CREATE\",\"Date\":\"2021-08-24T00:00:00.000Z\"},{\"Type\":\"UPDATE\",\"Date\":\"2021-08-24T00:00:00.000Z\"}],\"Abstract\":\"The
        Harmonized Landsat Sentinel-2 (HLS) project provides consistent surface reflectance
        (SR) and top of atmosphere (TOA) brightness data from a virtual constellation
        of satellite sensors. The Operational Land Imager (OLI) is housed aboard the
        joint NASA/USGS Landsat 8 and Landsat 9 satellites, while the Multi-Spectral
        Instrument (MSI) is mounted aboard Europe\u2019s Copernicus Sentinel-2A, Sentinel-2B,
        and Sentinel-2C satellites. The combined measurement enables global observations
        of the land every 1.6 days at 30-meter (m) spatial resolution. The HLS project
        uses a set of algorithms to obtain seamless products from OLI and MSI that
        include atmospheric correction, cloud and cloud-shadow masking, spatial co-registration
        and common gridding, illumination and view angle normalization, and spectral
        bandpass adjustment.\\n\\nThe HLSL30 product provides 30-m Nadir Bidirectional
        Reflectance Distribution Function (BRDF)-Adjusted Reflectance (NBAR) and is
        derived from Landsat 8/9 OLI data products. The [HLSS30](https://doi.org/10.5067/HLS/HLSS30.002)
        and HLSL30 products are gridded to the same resolution and Military Grid Reference
        System ([MGRS](https://hls.gsfc.nasa.gov/products-description/tiling-system/))
        tiling system and thus are \u201Cstackable\u201D for time series analysis.\\n\\nThe
        HLSL30 product is provided in Cloud Optimized GeoTIFF (COG) format, and each
        band is distributed as a separate file. There are 11 bands included in the
        HLSL30 product along with one quality assessment (QA) band and four angle
        bands. See the User Guide for a more detailed description of the individual
        bands provided in the HLSL30 product.\\n\\nThe HLS project is funded by NASA\u2019s
        Satellite Needs Working Group (SNWG) which provides data products developed
        to meet the needs of stakeholders from US government agencies.\\n\\nFor information
        on [known issues](https://lpdaac.usgs.gov/documents/2434/HLS_v2.0_L30_known_issues_April2026.pdf)
        see the anomalies link under the Documents and Resources tab.\",\"LocationKeywords\":[{\"Category\":\"GEOGRAPHIC
        REGION\",\"Type\":\"GLOBAL LAND\"}],\"MetadataDates\":[{\"Type\":\"CREATE\",\"Date\":\"2021-07-19T16:38:00.000Z\"},{\"Type\":\"UPDATE\",\"Date\":\"2026-01-14T00:00:00.000Z\"}],\"VersionDescription\":\"The
        following improvement was implemented for the HLS surface reflectance Version
        2 data products: Aerosol QA bits from the USGS Land Surface Reflectance Code
        (LaSRC) model output have been added into the Function of Mask (Fmask) data
        layer. The two added bits indicate the aerosol levels: high, medium, low,
        and climatology aerosol.\",\"Version\":\"2.0\",\"Projects\":[{\"ShortName\":\"HLS\",\"LongName\":\"Harmonized
