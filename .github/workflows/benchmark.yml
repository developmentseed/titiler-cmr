name: Benchmark

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  UV_FROZEN: 'true'
  UV_NO_PROGRESS: 'true'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked]
        # This workflow commits benchmark results via git push, so
        # persisted credentials are required for the push step.

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync

      - name: Run benchmark
        run: |
          uv run pytest --benchmark-only --benchmark-json benchmark.json

      - name: Commit benchmark results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add benchmark.json
          git commit -m "Update benchmark results" || echo "No changes to commit"
          git push
