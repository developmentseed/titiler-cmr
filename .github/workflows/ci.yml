name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'pyproject.toml'
      - 'infrastructure/aws/**'
      - 'titiler/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions: {}

env:
  LATEST_PY_VERSION: '3.13'

jobs:
  lint-python:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ env.LATEST_PY_VERSION }}

      - name: Run pre-commit hooks
        run: uv run prek run --all-files

      - name: Check docs
        env:
          MKDOCS_JUPYTER_EXECUTE: "false"
        run: uv run mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest

  cdk-cli:
    name: CDK CLI reads aws-cdk-lib's output
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infrastructure/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The fix instructions read aws-cdk-lib from HEAD^1, which is the
          # base branch on a pull request (HEAD is the merge commit) and the
          # previous commit on a push.
          fetch-depth: 2

      # The same Node version as the cdk-deploy action, so the CLI runs here
      # as it does in a deploy.
      - name: Install node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Install the CDK CLI
        run: npm ci

      # Deploys run `cdk synth` on the real app, whose Docker build takes
      # minutes. An empty stack writes the same cloud assembly format, so
      # synthesizing one checks in seconds that the CLI in package-lock.json
      # can read what aws-cdk-lib in uv.lock writes.
      - name: Synthesize an empty stack
        run: |
          empty_stack='import aws_cdk as cdk; cdk.Stack(app := cdk.App(), "Probe"); app.synth()'

          if out=$(
              uv run --quiet --locked --only-group deployment \
              npx cdk synth --quiet --app "python -c '${empty_stack}'" 2>&1
          ); then
              exit 0
          fi

          echo "$out"

          if grep -q "schema version mismatch" <<< "$out"; then
              # The same 7-day cooldown as .github/dependabot.yml.
              before=$(date -u -d '7 days ago' +%F)
              prev_lib=$(git show HEAD^1:uv.lock | python3 -c 'import sys, tomllib; print(next(p["version"] for p in tomllib.load(sys.stdin.buffer)["package"] if p["name"] == "aws-cdk-lib"))')

              echo "::error title=aws-cdk-lib needs a newer CDK CLI::This failure is not caused by your code. The log of the \"Synthesize an empty stack\" step shows how to fix it."
              printf '%s\n' \
                  "" \
                  "The aws-cdk-lib in uv.lock writes a format that the CDK CLI in infrastructure/aws/package-lock.json cannot read, so every deploy would fail. Try these in order until this check passes:" \
                  "" \
                  "1. If Dependabot has an open pull request that updates cdk in /infrastructure/aws, merge it, then bring this branch up to date with main (on a Dependabot pull request, comment \"@dependabot rebase\")." \
                  "" \
                  "2. Update the CLI. Run this from the repository root and commit the two changed files:" \
                  "" \
                  "       npm --prefix infrastructure/aws install cdk@latest --before $before" \
                  "" \
                  "3. If no CDK CLI release from before $before reads this aws-cdk-lib yet, keep aws-cdk-lib at $prev_lib, the version uv.lock had before this change:" \
                  "" \
                  "       uv lock --upgrade-package aws-cdk-lib==$prev_lib" \
                  "" \
                  "Background: https://github.com/developmentseed/titiler-cmr/issues/283"
          fi

          exit 1
