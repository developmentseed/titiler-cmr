version: 2
updates:
  - package-ecosystem: uv
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"

  # The CDK CLI must be new enough to read what aws-cdk-lib (in uv.lock)
  # writes. The "CDK CLI reads aws-cdk-lib's output" CI job checks the pair.
  - package-ecosystem: npm
    directory: "/infrastructure/aws"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: pre-commit
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"
