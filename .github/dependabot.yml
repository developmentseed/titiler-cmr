version: 2
updates:
  # Dependabot updates only the dependencies that pyproject.toml lists, and the
  # monthly refresh-lock.yml workflow re-locks the rest of uv.lock.
  - package-ecosystem: uv
    # Keep this equal to `exclude-newer` in pyproject.toml, because uv applies
    # that setting to Dependabot's runs too. With a shorter cooldown here,
    # Dependabot targets releases that uv refuses, and its job fails instead of
    # opening a pull request for that package.
    cooldown:
      default-days: 7
    directory: "/"
    # Dependabot targets boto3's newest release, which requires a newer botocore
    # than aiobotocore (via earthaccess and s3fs) allows, so its job fails.
    # refresh-lock.yml resolves all three together, so it moves boto3 as soon
    # as a new aiobotocore allows a newer botocore.
    # Remove this ignore once Dependabot skips an update it cannot resolve
    # instead of failing the job (dependabot/dependabot-core#15603).
    ignore:
      - dependency-name: "boto3"
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      # No security-updates group: while a grouped security PR is open, Dependabot defers fixes for packages not already in it.
    commit-message:
      prefix: "chore(deps):"

  # The CDK CLI must be new enough to read what aws-cdk-lib (in uv.lock)
  # writes. The "CDK CLI reads aws-cdk-lib's output" CI job checks the pair.
  - package-ecosystem: npm
    directory: "/infrastructure/aws"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      # No security-updates group: while a grouped security PR is open, Dependabot defers fixes for packages not already in it.
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: pre-commit
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"
