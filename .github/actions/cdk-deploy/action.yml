name: Deploy
description: Deploy CDK stack

inputs:
  env_aws_secret_name:
    description: Name of AWS secret containing environment configuration
    required: false
    default: ''
  dir:
    description: Deployment working directory
    required: false
    default: "."
  script_path:
    description: Path of a deployment script
    required: true
    default: ''
  skip_deploy:
    description: Skip deployment?
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Install node and related deps
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.11.*"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        uv sync --group deployment
        npm ci

    - name: Get relevant environment configuration from aws secrets
      if: inputs.env_aws_secret_name != ''
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        AWS_DEFAULT_REGION: us-west-2
        SCRIPT_PATH: ${{ inputs.script_path }}
        ENV_AWS_SECRET_NAME: ${{ inputs.env_aws_secret_name }}
      run: uv run --group deployment "${SCRIPT_PATH}" --secret-id "${ENV_AWS_SECRET_NAME}"

    - name: CDK Synth
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: uv run --group deployment npm run cdk -- synth

    - name: Check Asset Sizes
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        MAX_SIZE_BYTES=262144000  # 250 MiB in bytes (250 * 1024 * 1024)
        for dir in cdk.out/asset.*; do
          if [ -d "$dir" ]; then
            size=$(du -sb "$dir" | cut -f1)
            if [ "$size" -gt $MAX_SIZE_BYTES ]; then
              echo "Directory $dir exceeds 250 MiB with size $size bytes (max: $MAX_SIZE_BYTES bytes)."
              exit 1
            fi
            echo "Asset directory $dir size: $size bytes"
          fi
        done
        echo "All asset directories are within size limits."

    - name: Deploy Test
      if: ${{ inputs.skip_deploy == 'false' }}
      id: deploy_titiler_cmr_stack
      working-directory: ${{ inputs.dir }}
      run: uv run --group deployment npm run cdk -- deploy --all --require-approval never --outputs-file ${HOME}/cdk-outputs.json
      shell: bash
